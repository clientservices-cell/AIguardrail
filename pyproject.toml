[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "seed-first-guardrail"
version = "0.1.0"
description = "Intergenerational AI guardrail middleware implementing the Seed-First AI Act three-tier architecture."
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSE"]
keywords = ["ai-safety", "guardrails", "governance", "llm", "middleware", "ubuntu", "care-principles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.60"]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
seed-first-guardrail = "seed_first_guardrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seed_first_guardrail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["seed_first_guardrail"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF012", "E501"]  # line length is enforced by `ruff format`

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["seed_first_guardrail"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "langchain_core.*"]
ignore_missing_imports = true
