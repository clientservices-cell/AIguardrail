name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples docs/build
      - run: ruff format --check src tests examples docs/build
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=seed_first_guardrail --cov-fail-under=95
      - run: seed-first-guardrail validate-policy policy/examples/ubuntu.policy.json policy/examples/tillit.policy.json policy/examples/indigenous_care.policy.json
      - run: python examples/demo.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Check wheel contains schema
        run: python -c "import zipfile,glob,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'seed_first_guardrail/schemas/seed_first_policy.schema.json' in n else 1)"

  docs:
    # Builds the Word versions of the docs (without the Windows-only Word step) so a
    # Markdown change that breaks the converter is caught. build.py fails on invalid
    # packages, leftover equation placeholders or garbled characters.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/build/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci --prefix docs/build
      - run: pip install -r docs/build/requirements.txt
      - run: python docs/build/build.py --no-word
      - uses: actions/upload-artifact@v4
        with:
          name: word-documents
          path: docs/build/out/*.docx
          retention-days: 14
